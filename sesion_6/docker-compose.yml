# Pila local: Ollama (modelo) + gateway FastAPI + dashboard React.
#   docker compose up -d --build
#   docker compose exec ollama ollama pull llama3.2:1b     # una sola vez
#   abrir http://localhost:5173
# Para GPU NVIDIA descomente el bloque `deploy` de `ollama` (requiere NVIDIA Container Toolkit).
services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"     # solo accesible desde su máquina
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  backend:
    build: ./backend
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      GATEWAY_API_KEYS: ${GATEWAY_API_KEYS:-}
      DAILY_BUDGET_USD_PER_CLIENT: ${DAILY_BUDGET_USD_PER_CLIENT:-0.50}
      INFRA_COST_PER_HOUR_USD: ${INFRA_COST_PER_HOUR_USD:-0}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-30}
    depends_on:
      - ollama
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5173:80"

volumes:
  ollama-models:
