name: ci
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: cd backend && python -m pytest -q
      - run: cd finops && python -m pytest -q
      - run: cd loadtest && python -m pytest -q
      - run: cd cloud-agents/common && python -m pytest -q
      - run: python scripts/sync_tools.py --check
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: cd frontend && npm install --no-audit --no-fund && npm test && npm run build
