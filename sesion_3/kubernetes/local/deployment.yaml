# ============================================================
# kubernetes/local/deployment.yaml
# Kubernetes local con Minikube
# Sesión 3: BSG Institute
# ============================================================
#
# Este archivo define todos los recursos Kubernetes para
# desplegar la LLM Gateway API en Minikube (local).
#
# Requisito previo: Ollama corriendo en el host Ubuntu
#   ollama serve
#
# Uso:
#   minikube start
#   kubectl apply -f kubernetes/local/deployment.yaml
#   minikube service llm-gateway-service -n llm-session3 --url
# ============================================================

---
# ── 1. Namespace: aísla los recursos de esta app ────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: llm-session3
  labels:
    app: llm-gateway
    environment: local
    curso: bsg-llm-infra

---
# ── 2. ConfigMap: variables de configuración (no secretas) ──────────────────
# Apunta al Ollama que corre en el host Ubuntu, no dentro del cluster.
# host.docker.internal es resuelto por hostAliases en el Pod spec.
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-gateway-config
  namespace: llm-session3
data:
  OLLAMA_BASE_URL: "http://host.docker.internal:11434"
  ENVIRONMENT: "local"
  LOG_LEVEL: "INFO"
  PORT: "8000"

---
# ── 3. Deployment de la API FastAPI ─────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  namespace: llm-session3
  labels:
    app: llm-gateway
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: llm-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: llm-gateway
        version: "1.0.0"
    spec:
      # Resuelve host.docker.internal → IP del host Ubuntu donde corre Ollama.
      #
      # IMPORTANTE: Esta IP varía según el equipo. Antes de desplegar:
      #   1. En el host Ubuntu, ejecutar: hostname -I
      #   2. Tomar la primera IP de la lista (interfaz principal)
      #   3. Verificar que Ollama responde: curl http://<esa-ip>:11434/api/tags
      #   4. Reemplazar la IP de abajo con la obtenida
      #
      # NO usar 192.168.49.1 (gateway de Minikube con driver VirtualBox — no
      # alcanzable desde pods con driver Docker en Linux/WSL2).
      hostAliases:
        - ip: "172.23.35.21"      # <-- REEMPLAZAR con: hostname -I | awk '{print $1}'
          hostnames:
            - "host.docker.internal"

      containers:
        - name: llm-gateway
          image: llm-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: llm-gateway-config
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3

---
# ── 4. Service: expone el Deployment ────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: llm-gateway-service
  namespace: llm-session3
  labels:
    app: llm-gateway
spec:
  type: NodePort
  selector:
    app: llm-gateway
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
      nodePort: 30880

---
# ── 5. HorizontalPodAutoscaler ───────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: llm-gateway-hpa
  namespace: llm-session3
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: llm-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80